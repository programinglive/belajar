name: Belajar production pilot

on:
  workflow_run:
    workflows: [Belajar CI]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: read

jobs:
  pilot:
    name: Complete production API journey
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check pilot configuration
        id: pilot
        shell: bash
        env:
          BELAJAR_PILOT_EMAIL: ${{ secrets.BELAJAR_PILOT_EMAIL }}
          BELAJAR_PILOT_PASSWORD: ${{ secrets.BELAJAR_PILOT_PASSWORD }}
        run: |
          if [[ -n "$BELAJAR_PILOT_EMAIL" && -n "$BELAJAR_PILOT_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Production pilot skipped because pilot credentials are not configured."
          fi

      - name: Run production API journey
        id: api
        if: steps.pilot.outputs.configured == 'true'
        continue-on-error: true
        run: node scripts/pilot-api-smoke.cjs
        env:
          PILOT_API_BASE_URL: https://belajar.programinglive.com
          PILOT_EXPECTED_VERSION: ${{ github.event.workflow_run.head_branch }}
          BELAJAR_PILOT_EMAIL: ${{ secrets.BELAJAR_PILOT_EMAIL }}
          BELAJAR_PILOT_PASSWORD: ${{ secrets.BELAJAR_PILOT_PASSWORD }}

      - name: Run production browser journey
        id: browser
        if: steps.pilot.outputs.configured == 'true'
        continue-on-error: true
        run: node scripts/pilot-browser-smoke.cjs
        env:
          PILOT_WEB_BASE_URL: https://belajar.programinglive.com
          BELAJAR_PILOT_EMAIL: ${{ secrets.BELAJAR_PILOT_EMAIL }}
          BELAJAR_PILOT_PASSWORD: ${{ secrets.BELAJAR_PILOT_PASSWORD }}

      - name: Report result to Discord
        if: always() && steps.pilot.outputs.configured == 'true'
        run: node scripts/post-pilot-result.cjs
        env:
          DISCORD_PILOT_WEBHOOK_URL: ${{ secrets.DISCORD_PILOT_WEBHOOK_URL }}
          PILOT_API_RESULT: ${{ steps.api.outcome }}
          PILOT_BROWSER_RESULT: ${{ steps.browser.outcome }}

      - name: Enforce pilot result
        if: always() && steps.pilot.outputs.configured == 'true'
        env:
          PILOT_API_RESULT: ${{ steps.api.outcome }}
          PILOT_BROWSER_RESULT: ${{ steps.browser.outcome }}
        run: |
          if [[ "$PILOT_API_RESULT" != "success" || "$PILOT_BROWSER_RESULT" != "success" ]]; then
            exit 1
          fi
