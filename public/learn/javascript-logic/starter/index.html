<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana — Starter Code</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Hubungkan script JavaScript dengan defer agar dimuat setelah DOM siap -->
    <script src="app.js" defer></script>
</head>
<body>
    <div class="calculator-card">
        <h1>Kalkulator Sederhana</h1>
        <p class="subtitle">Belajar Logika JavaScript & Manipulasi DOM</p>

        <div class="input-group">
            <label for="angka1">Angka Pertama:</label>
            <input type="number" id="angka1" placeholder="Masukkan angka pertama">
        </div>

        <div class="input-group">
            <label for="angka2">Angka Kedua:</label>
            <input type="number" id="angka2" placeholder="Masukkan angka kedua">
        </div>

        <div class="buttons-grid">
            <button id="btn-tambah" class="btn btn-op">+</button>
            <button id="btn-kurang" class="btn btn-op">−</button>
            <button id="btn-kali" class="btn btn-op">×</button>
            <button id="btn-bagi" class="btn btn-op">÷</button>
        </div>

        <button id="btn-reset" class="btn btn-reset">Reset / Bersihkan</button>

        <div class="result-box">
            <span class="result-label">Hasil:</span>
            <span id="hasil-teks" class="result-value">0</span>
        </div>
    </div>
</body>
</html>
